name: CSC-LCH offline validation

on:
  push:
    branches: [main, "docs/**", "test/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Prevent accidental provider-backed behavior in CI.
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Run zero-cost dry-run smoke test
        run: |
          mkdir -p benchmark-results
          python csc_lch_bench.py --dry-run --scale 1 --out benchmark-results/csc-lch-dry-run
      - name: Upload offline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csc-lch-offline-report
          path: |
            benchmark-results/csc-lch-dry-run.txt
            benchmark-results/csc-lch-dry-run.json
          if-no-files-found: warn
