name: CSC-LCH v1.2 compression benchmark

on:
  push:
    branches: ["feat/semantic-compression-benchmark-v1.2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  benchmark-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local tokenizer
        run: python -m pip install tiktoken
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline tokenizer benchmark
        run: python csc_lch_compression_bench.py --selected 0,2 --output csc_lch_v1_2_benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: csc-lch-v1.2-benchmark-py${{ matrix.python-version }}
          path: csc_lch_v1_2_benchmark.json
