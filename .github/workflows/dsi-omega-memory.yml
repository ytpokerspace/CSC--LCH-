name: DSI-Ω CSC-LCH memory tests

on:
  push:
    branches:
      - feat/dsi-omega-csc-lch-memory
    paths:
      - "dsi_omega/**"
      - "tests/test_dsi_omega_memory.py"
      - ".github/workflows/dsi-omega-memory.yml"
  pull_request:
    branches:
      - main
    paths:
      - "dsi_omega/**"
      - "tests/test_dsi_omega_memory.py"
      - ".github/workflows/dsi-omega-memory.yml"

permissions:
  contents: read

jobs:
  offline-memory-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline memory interface tests
        run: python -m unittest discover -s tests -p "test_dsi_omega_memory.py" -v
